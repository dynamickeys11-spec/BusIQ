name: BUSIQ CI
on:
  push:
    branches: ["main", "feat/**"]
  pull_request:
    branches: ["main"]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Type check
        id: typecheck
        continue-on-error: true
        run: |
          set -o pipefail
          npm run check 2>&1 | tee typecheck.log
      - name: Capture typecheck failure
        if: steps.typecheck.outcome == 'failure'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add typecheck.log
          git commit -m "ci: capture typecheck failure" || true
          git push
          exit 1
      - name: Production build
        if: steps.typecheck.outcome == 'success'
        run: npm run build
